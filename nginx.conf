upstream django_backend {
    server web:8000;
}

# 🔹 HTTP — только редирект на HTTPS
server {
    listen 80;
    server_name gorillapulse.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 🔹 HTTPS — основная конфигурация
server {
    listen 443 ssl;
    server_name gorillapulse.ru;

    ssl_certificate /etc/letsencrypt/live/gorillapulse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gorillapulse.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Отключаем sendfile для Windows
    sendfile off;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
        proxy_pass http://django_backend/;
    }

    location /static/ {
        alias /app/static_collected/;
        expires 1y;
        access_log off;

        types {
            text/css css;
            application/javascript js;
            image/svg+xml svg;
        }
        default_type application/octet-stream;

        disable_symlinks off;

        add_header Cache-Control "public, max-age=31536000";
        add_header X-Content-Type-Options "nosniff";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}