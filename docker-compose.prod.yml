services:
  web:
    image: ${IMAGE}
    command: >
      bash -c "python manage.py collectstatic -c --no-input &&
               python manage.py migrate &&
               gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --log-level debug --access-logfile - --error-logfile -"
    env_file:
      - .env
    environment:
      - DEBUG=False
    volumes:
      - static_volume:/app/static_collected
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # проверка TCP-порта через Python (есть в образе)
      test: [ "CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); s.close()" ]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:17.1-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static_collected
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Явно используем IPv4, чтобы не уткнуться в ::1
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
  static_volume: