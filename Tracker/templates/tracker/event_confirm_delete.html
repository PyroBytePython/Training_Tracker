{% extends "tracker/base.html" %}

{% block title %}Удалить тренировку{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card shadow-sm p-4">
    <h4 class="fw-bold mb-3">Удалить тренировку</h4>
    <p>Вы уверены, что хотите удалить тренировку <strong>{{ object.title }}</strong> 
       ({{ object.start|date:"d.m.Y H:i" }})?</p>

    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2 mt-4">
        <a href="{% url 'tracker:calendar' %}" class="btn btn-outline-secondary">
          <i class="bi bi-x-lg me-1"></i> Отмена
        </a>
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash me-1"></i> Удалить
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
