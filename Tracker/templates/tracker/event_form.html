{% extends "tracker/base.html" %}

{% block title %}Добавить тренировку{% endblock %}

{% block content %}
<div class="container mt-4">

  <!-- Кнопка назад -->
  <div class="mb-4">
    <a href="{% url 'tracker:calendar' %}" class="btn btn-outline-hero shadow-sm">
      <i class="bi bi-arrow-left"></i> Назад к календарю
    </a>
  </div>

  <!-- Карточка формы -->
  <div class="card workout-card p-4 border-0 glass-effect animate-fade-in">
    <div class="d-flex align-items-center mb-3">
      <div class="feature-icon gradient-core me-3">
        <i class="bi bi-calendar-plus"></i>
      </div>
      <h4 class="fw-bold mb-0">Добавить тренировку</h4>
    </div>

    <form method="post" class="mt-3">
      {% csrf_token %}
      <input type="hidden" name="date" value="{{ request.GET.date }}">

      <div class="mb-3">
        <label for="id_title" class="form-label fw-semibold">Название</label>
        <input type="text" name="title" id="id_title" class="form-control" placeholder="Например: Руки, Ноги" required>
      </div>

      <div class="mb-3">
        <label for="id_time" class="form-label fw-semibold">Время</label>
        <input type="time" name="time" id="id_time" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="id_note" class="form-label fw-semibold">Заметка</label>
        <textarea name="note" id="id_note" rows="3" class="form-control" placeholder="Дополнительная информация (необязательно)"></textarea>
      </div>

      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-gradient px-4">
          <i class="bi bi-plus-lg me-1"></i> Сохранить
        </button>
      </div>
    </form>
  </div>
</div>

<style>
.animate-fade-in {
  animation: fadeInUp 0.5s ease-out;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.feature-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:1.2rem;
}
.gradient-core { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
</style>

<link rel="stylesheet" href="https://unpkg.com/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
{% endblock %}
