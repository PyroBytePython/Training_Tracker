{% extends "Tracker/base.html" %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center login-page">
  <div class="card shadow-sm col-12 col-md-8 col-lg-6 login-card">
    <div class="card-body p-4">
      <h2 class="text-center mb-4 text-white">Вход в <span>Tracker</span></h2>
      {% if form.errors %}
      <div class="alert alert-danger alert-dismissible fade show">
        Неверный логин или пароль
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endif %}
      <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <div class="mb-3">
          <label for="id_username" class="form-label text-white">Имя пользователя</label>
          <input type="text" name="username" class="form-control" id="id_username" required>
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label text-white">Пароль</label>
          <input type="password" name="password" class="form-control" id="id_password" required>
        </div>
        <button type="submit" class="btn btn-login w-100 py-2 mb-3">Войти</button>
        <a href="/" class="btn btn-back w-100 py-2 mb-3">Назад</a>
        <div class="d-flex justify-content-between mb-3">
          <a href="{% url 'users:register' %}" class="form-link">Регистрация</a>
          <a href="#" class="form-link">Забыли пароль?</a>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
/* Фон страницы */
.login-page {
    min-height: 80vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
}

/* Карточка */
.login-card {
    border-radius: 1rem;
    background: rgba(30, 60, 114, 0.85); /* глубокий тёмно-синий с прозрачностью */
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    color: white;
}

/* Заголовок */
.login-card h2 span {
    color: #4facfe;
}

/* Поля ввода */
.form-control {
    border-radius: 50px;
    padding: 0.6rem 1rem;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.15);
    color: white;
}
.form-control::placeholder {
    color: rgba(255,255,255,0.7);
}
.form-control:focus {
    background: rgba(255,255,255,0.25);
    box-shadow: 0 0 0 3px rgba(79,172,254,0.4);
}

/* Кнопка Войти */
.btn-login {
    background-color: #4facfe;
    color: white;
    border: none;
    border-radius: 50px;
    font-weight: 600;
}
.btn-login:hover {
    background-color: #00c6ff;
}

/* Кнопка Назад */
.btn-back {
    background: linear-gradient(45deg, #f093fb, #f5576c);
    color: white;
    border: none;
    border-radius: 50px;
    font-weight: 600;
}
.btn-back:hover {
    background: linear-gradient(45deg, #f5576c, #f093fb);
}

/* Ссылки */
.form-link {
    color: #ffffffcc;
    text-decoration: none;
    font-weight: 500;
}
.form-link:hover {
    color: white;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
}

/* Мобильная адаптация */
@media (max-width: 576px) {
    .login-card {
      background: rgba(30, 60, 114, 0.95);
      color: white;
    }
}
</style>
{% endblock %}
