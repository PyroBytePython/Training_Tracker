{% extends "tracker/base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title">Подтверждение email</h2>
                    <p>Мы отправили код подтверждения на ваш email: <strong>{{ email }}</strong></p>

                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                    {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_code" class="form-label">Код подтверждения</label>
                            <input type="text" name="code" class="form-control" id="id_code" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Подтвердить</button>
                    </form>

                    <div class="mt-3">
                        <a href="{% url 'users:resend_code' %}" class="text-muted">Отправить код повторно</a>
                    </div>
                    <div class="mt-3">
                        <a href="{% url 'users:register' %}" class="btn btn-outline-secondary">
                            Изменить email
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
